<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蓝鲸游戏厅</title>
  <link rel="stylesheet" href="hub/style.css">
</head>
<body>
  <header class="hub-header">
    <h1>🐋 蓝鲸游戏厅</h1>
    <p class="hub-sub">DeepSeek 拟人形象小游戏合集</p>
  </header>

  <main id="game-grid" class="game-grid" aria-label="游戏列表"></main>

  <div id="hub-error" class="hub-error" hidden></div>

  <!-- 游戏模态：遮罩 + 标题栏 + iframe 容器 -->
  <div id="game-modal" class="modal" hidden>
    <div class="modal-mask"></div>
    <div class="modal-inner">
      <div class="modal-titlebar">
        <span id="modal-title" class="modal-title"></span>
        <span class="modal-hud">分数：<b id="modal-score">—</b></span>
        <span id="best-toast" class="best-toast" hidden></span>
        <button id="btn-pause" class="btn" type="button">暂停</button>
        <button id="btn-close" class="btn btn-close" type="button">关闭</button>
      </div>
      <div id="iframe-box" class="iframe-box"></div>
    </div>
  </div>

  <script src="hub/main.js"></script>
</body>
</html>
